[project]
name = "podr-service"
version = "1.0.0"
description = "Podr's FastAPI service on Cloudflare Workers"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk", "pytest>=8", "pytest-asyncio>=1", "ruff>=0.11"]
proxy = ["uvicorn>=0.34"]

[tool.uv]
default-groups = ["dev", "proxy"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC240"]
