name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Package Worker
        run: uv run pywrangler deploy --dry-run --outdir=dist --containers-rollout=none
      - name: Build proxy container
        run: docker build -t podr-proxy:test .
      - uses: actions/dependency-review-action@v5
        if: github.event_name == 'pull_request'
